<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Stair Game - Algebra Challenge (Index Laws)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.4/TweenMax.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background-color: black;
      font-family: Arial, sans-serif;
      touch-action: none; /* Prevent scroll */
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    #startBtn {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 40px;
      width: 80%;
      max-width: 300px;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 500px;
      outline: none;
      font-size: 30px;
      letter-spacing: 1px;
      cursor: pointer;
      border: none;
      box-shadow: 0px 0px 20px rgba(255, 255, 255, 0.3);
      z-index: 10;
      white-space: nowrap;
    }

    #startBtn:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }
    
    /* Leaderboard styles */
    #leaderboard {
      display: none; 
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.95);
      color: white;
      padding: 20px;
      border-radius: 15px;
      font-size: 16px;
      z-index: 25;
      width: 85%;
      max-width: 350px;
      box-shadow: 0 0 20px rgba(83, 211, 55, 0.5);
      border: 2px solid #53d337;
      max-height: 80vh;
      overflow-y: auto;
      box-sizing: border-box;
    }
    
    #leaderboard h3 {
      margin: 0 0 15px 0;
      text-align: center;
      color: #ffdd38;
      font-size: 22px;
    }
    
    #leaderboard ol {
      padding-left: 25px;
      margin: 0;
    }
    
    #leaderboard li {
      margin-bottom: 6px;
      color: white;
      font-size: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 4px 0;
    }
    
    .current-score {
      color: #53d337 !important;
      font-weight: bold;
    }

    #restartBtn {
        display: block;
        margin: 20px auto 0 auto;
        padding: 10px 30px;
        width: 100%;
        background-color: #53d337;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        cursor: pointer;
    }
    
    /* Name input modal */
    #nameModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 30;
      justify-content: center;
      align-items: center;
    }
    
    .modal-content {
      background-color: rgba(50, 50, 50, 0.95);
      padding: 30px;
      width: 80%;
      max-width: 300px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
    }
    
    #nameInput {
      padding: 10px;
      font-size: 18px;
      border: 2px solid #53d337;
      border-radius: 5px;
      background-color: #222;
      color: white;
      margin: 15px 0;
      width: 80%;
      text-align: center;
    }
    
    #submitName {
      padding: 10px 30px;
      font-size: 18px;
      background-color: #53d337;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }
    
    .modal-title {
      color: #ffdd38;
      font-size: 24px;
      margin-bottom: 15px;
    }
    
    /* Touch controls - CENTER SIDES */
    #touchControls {
      position: fixed;
      top: 50%; /* Center Vertically */
      transform: translateY(-50%);
      width: 100%;
      display: flex;
      justify-content: space-between; 
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 20;
      pointer-events: none; 
    }
    
    .touch-btn {
      pointer-events: auto; 
      width: 80px;
      height: 80px;
      background-color: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      color: white;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.1s;
      backdrop-filter: blur(2px);
    }

    .touch-btn:active {
        background-color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <canvas id="mycanvas"></canvas>
  <button id="startBtn" onclick="game.start()">Start Algebra</button>

  <div id="leaderboard">
    <h3>🏆 Algebra Ranking</h3>
    <ol id="scoresList"></ol>
    <button id="restartBtn" onclick="game.restartGame()">Play again</button>
  </div>

  <div id="nameModal">
    <div class="modal-content">
      <div class="modal-title">New Record！</div>
      <div class="score-display">Basement <span id="currentScoreDisplay" style="color:#53d337; font-weight:bold;">0</span> /F</div>
      <input type="text" id="nameInput" placeholder="Input your name" maxlength="8" autocomplete="off">
      <br>
      <button id="submitName">Submit</button>
    </div>
  </div>
  
  <div id="touchControls">
    <div class="touch-btn" id="leftBtn">◀</div>
    <div class="touch-btn" id="rightBtn">▶</div>
  </div>

  <script>
    //環境變數
    var updateFPS = 30
    var showMouse = true
    var time = 0
    var bgColor ="black"
    var ww, wh; 

    //控制
    var controls = {
      value: 0
    }
    var gui = new dat.GUI()
    gui.add(controls,"value",-2,2).step(0.01).onChange(function(value){})
    gui.close(); 
    document.querySelector('.dg.ac').style.display = 'none';

    // Audio setup removed

    //------------------------
    // Helpers for Formatting
    //------------------------
    
    // Converts numbers to unicode superscripts
    const toSuperscript = (num) => {
        const map = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
        return num.toString().split('').map(c => map[c] || c).join('');
    };

    // Draws text. If string contains "_over_", draws a formal vertical fraction.
    const drawFormalExpression = (ctx, text, x, y, fontSize, color = "white", align = "center") => {
        ctx.fillStyle = color;
        
        if (text.includes("_over_")) {
            const parts = text.split("_over_");
            const num = parts[0];
            const den = parts[1];
            
            ctx.font = "bold " + (fontSize * 0.85) + "px Arial"; 
            const numMetrics = ctx.measureText(num);
            const denMetrics = ctx.measureText(den);
            const maxWidth = Math.max(numMetrics.width, denMetrics.width);
            
            let startX = x;
            if (align === "center") startX = x - maxWidth / 2;
            else if (align === "right") startX = x - maxWidth;

            // Draw Numerator
            ctx.textAlign = "center";
            ctx.fillText(num, startX + maxWidth / 2, y - fontSize * 0.4);
            
            // Draw Line
            ctx.fillRect(startX, y - fontSize * 0.25, maxWidth, Math.max(2, fontSize/15));
            
            // Draw Denominator
            ctx.fillText(den, startX + maxWidth / 2, y + fontSize * 0.7);
            
            // Reset align
            ctx.textAlign = align;
        } else {
            ctx.font = "bold " + fontSize + "px Arial";
            ctx.textAlign = align;
            ctx.fillText(text, x, y);
        }
    };

    //------------------------
    // Vec2
    class Vec2{
      constructor(x,y){
        this.x = x
        this.y = y
      }
      set(x,y){
        this.x =x
        this.y =y
      }
      move(x,y){
        this.x+=x
        this.y+=y
      }
      add(v){
        return new Vec2(this.x+v.x,this.y+v.y)
      }
      sub(v){
        return new Vec2(this.x-v.x,this.y-v.y)
      }
      mul(s){
        return new Vec2(this.x*s,this.y*s)
      }
      get length(){
        return Math.sqrt(this.x*this.x+this.y*this.y)
      }
      set length(nv){
        let temp = this.unit.mul(nv)
        this.set(temp.x,temp.y)
      }
      clone(){
        return new Vec2(this.x,this.y)
      }
      toString(){
        return `(${this.x}, ${this.y})`
      }
      equal(v){
        return this.x==v.x && this.y ==v.y
      }
      get angle(){
        return Math.atan2(this.y,this.x)  
      }
      get unit(){
        return this.mul(1/this.length)
      }
      
    }

    //------
    var canvas = document.getElementById("mycanvas")
    var ctx = canvas.getContext("2d")
    ctx.circle= function(v,r){
      this.arc(v.x,v.y,r,0,Math.PI*2)
    }
    ctx.line= function(v1,v2){
      this.moveTo(v1.x,v1.y)
      this.lineTo(v2.x,v2.y)
    }

    // Empty function to prevent errors when game logic calls for sound
    function playSound(id){
      // Sound disabled
    }

    function getLeaderboard() {
      const saved = localStorage.getItem('stairGameLeaderboard_algebra'); 
      return saved ? JSON.parse(saved) : [];
    }

    function saveLeaderboard(scores) {
      localStorage.setItem('stairGameLeaderboard_algebra', JSON.stringify(scores));
    }

    function updateLeaderboardDisplay() {
      const scores = getLeaderboard();
      const scoresList = document.getElementById('scoresList');
      scoresList.innerHTML = '';
      
      scores.slice(0, 10).forEach((entry, index) => {
        const li = document.createElement('li');
        li.textContent = `${entry.name}: ${entry.score}/F`;
        if (entry.isCurrent) {
          li.classList.add('current-score');
        }
        scoresList.appendChild(li);
      });
    }

    function checkNewRecord(score) {
      const scores = getLeaderboard();
      
      if (scores.length >= 10 && score <= scores[9].score) {
        document.getElementById('leaderboard').style.display = 'block';
        updateLeaderboardDisplay();
        return;
      }

      document.getElementById('currentScoreDisplay').textContent = score;
      document.getElementById('nameModal').style.display = 'flex';
      setTimeout(()=> document.getElementById('nameInput').focus(), 100);
    }

    function submitName() {
      const name = document.getElementById('nameInput').value.trim() || 'Unknown Hero';
      const score = parseInt(document.getElementById('currentScoreDisplay').textContent);
      
      const scores = getLeaderboard();
      const newEntry = { score: score, name: name, isCurrent: true };
      
      scores.forEach(s => s.isCurrent = false);
      
      scores.push(newEntry);
      scores.sort((a, b) => b.score - a.score); 
      
      const top10 = scores.slice(0, 10);
      
      saveLeaderboard(top10);
      
      document.getElementById('nameModal').style.display = 'none';
      document.getElementById('leaderboard').style.display = 'block';
      updateLeaderboardDisplay();
    }

    //遊戲物件
    class Game{
      constructor(){
        this.player = null
        this.walls = []
        this.width = Math.min(window.innerWidth, 700) 
        this.height = wh
        this.walltypes = [
          "normal","jump","slideLeft","slideRight",
          "hurt","fade"
        ]
        this.hurt=0
        this.playing=false
        this.keystatus = {
          left: false,
          right: false,
          up: false,
          down: false,
        }
        this.time=0
        
        this.mathQuestion = "";
        this.correctAnswer = "";
        this.wrongAnswer = "";
      }
      
      generateMathProblem() {
        // Randomly select Question Type
        // 0-0.3: Add/Sub, 0.3-0.6: Mult, 0.6-1.0: Div
        const typeRoll = Math.random();
        const vars = ["x", "y", "a"];
        const v = vars[Math.floor(Math.random() * vars.length)];

        // Helper to format term: 5, x, 2 => 5x²
        const fmt = (coeff, variable, pow) => {
            if (coeff === 0) return "0";
            let s = "";
            if (coeff !== 1 || pow === 0) s += coeff;
            else if (coeff === -1) s += "-";
            
            if (pow !== 0) {
                s += variable;
                if (pow !== 1) s += toSuperscript(pow);
            }
            return s;
        };

        if (typeRoll < 0.3) {
            // --- TYPE 1: Addition / Subtraction ---
            let n1 = Math.floor(Math.random() * 10) + 2;
            let n2 = Math.floor(Math.random() * 10) + 2;
            
            if (Math.random() > 0.5) {
                // Add: 3x + 4x
                this.mathQuestion = `${n1}${v} + ${n2}${v} = ?`;
                this.correctAnswer = (n1 + n2) + v;
                this.wrongAnswer = (n1 + n2 + 1) + v; // Arithmetic error
            } else {
                // Sub: 5x - 2x
                this.mathQuestion = `${n1}${v} - ${n2}${v} = ?`;
                this.correctAnswer = (n1 - n2) + v;
                if (this.correctAnswer === "0" + v) this.correctAnswer = "0";
                this.wrongAnswer = (n1 - n2 + 2) + v;
            }

        } else if (typeRoll < 0.65) {
            // --- TYPE 2: Multiplication (Index Law) ---
            // 2x^2 * 3x^3 = 6x^5
            let c1 = Math.floor(Math.random() * 5) + 2; // 2 to 6
            let c2 = Math.floor(Math.random() * 5) + 2;
            let p1 = Math.floor(Math.random() * 3) + 2; // 2 to 4
            let p2 = Math.floor(Math.random() * 3) + 2;
            
            let term1 = fmt(c1, v, p1);
            let term2 = fmt(c2, v, p2);
            
            this.mathQuestion = `${term1} × ${term2} = ?`;
            
            // Correct: Coeff Multiply, Powers Add
            this.correctAnswer = fmt(c1*c2, v, p1+p2);
            
            // Wrong 1: Multiply powers instead of add
            // Wrong 2: Add coeffs instead of multiply
            if (Math.random() > 0.5) {
                this.wrongAnswer = fmt(c1*c2, v, p1*p2); // Power error
            } else {
                this.wrongAnswer = fmt(c1+c2, v, p1+p2); // Coeff error
            }
            
            if (this.wrongAnswer === this.correctAnswer) this.wrongAnswer = fmt(c1*c2 + 2, v, p1+p2);

        } else {
            // --- TYPE 3: Division (Index Law) ---
            // Fraction: (A * x^p1 * y^p2) / (B * x^p3)
            
            let divisorC = Math.floor(Math.random() * 4) + 2; // 2 to 5
            let multiplier = Math.floor(Math.random() * 4) + 1; // 1 to 4
            let dividendC = divisorC * multiplier; // Ensures clean division
            
            let pBottom = Math.floor(Math.random() * 3) + 1; // 1 to 3
            let pDiff = Math.floor(Math.random() * 5) - 2; // -2 to +2 diff
            // if pDiff is 0, variables cancel out
            
            let pTop = pBottom + pDiff;
            if (pTop < 1) pTop = 1; // Ensure top has at least x
            
            // Update diff based on correction
            pDiff = pTop - pBottom;

            // Setup Question strings
            // Need to form a vertical fraction for the question string if possible
            let tTop = fmt(dividendC, v, pTop);
            let tBot = fmt(divisorC, v, pBottom);
            
            this.mathQuestion = `${tTop}_over_${tBot}`;

            // Calculate Answer
            let ansC = dividendC / divisorC;
            let ansP = pTop - pBottom;
            
            // Format Answer (Fraction handling)
            if (ansP >= 0) {
                // Result is not a fraction: 3x^2 or 3
                this.correctAnswer = fmt(ansC, v, ansP);
                
                // Wrong answer: Add powers instead of subtract
                this.wrongAnswer = fmt(ansC, v, pTop+pBottom);
            } else {
                // Result is fraction: 3 / x^2
                let denP = Math.abs(ansP);
                let botStr = fmt(1, v, denP); // x^2
                this.correctAnswer = `${ansC}_over_${botStr}`;
                
                // Wrong: 3x^2 (forgot it's denominator)
                this.wrongAnswer = fmt(ansC, v, denP);
            }
            
            // Edge case collision check
            if (this.wrongAnswer === this.correctAnswer) {
                 this.wrongAnswer = fmt(ansC + 1, v, 0);
            }
        }
      }

      init(){
        this.walls=[]
        this.width = Math.min(window.innerWidth, 700)
        this.generateMathProblem(); 
        
        let initialWallWidth = this.width < 400 ? 120 : 150;

        for(var i=0;i<wh/150;i++){
          this.walls.push(new Wall({
            p: new Vec2(Math.random()*(this.width - initialWallWidth) + initialWallWidth/2, i*150+100),
            width: initialWallWidth,
            type: "normal" 
          })) 
        }
        this.player = new Player({
          p: new Vec2(this.width/2, 200)
        })    
      }
      
      start(){
        // Audio play removed
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('leaderboard').style.display = 'none';
        this.init()
        this.playing=true
        this.time=0
      }
      
      restartGame() {
        document.getElementById('leaderboard').style.display = 'none';
        this.start();
      }

      end(){
        document.getElementById('startBtn').style.display = 'none'; 
        playSound('dead');  
        this.playing=false
        
        const finalScore = parseInt(this.time/100);
        checkNewRecord(finalScore);
      }
      
      update(){
        this.time++
        this.player.update()
        if (this.keystatus.left){
          this.player.p.x-=8
        }
        if (this.keystatus.right){
          this.player.p.x+=8
        }
        
        if (time%20==0){
          let newType = this.walltypes[parseInt(Math.random()*this.walltypes.length)];
          let wWidth = this.width < 400 ? 120 : 150;
          let safeX = Math.random() * (this.width - wWidth) + wWidth/2;

          let newWall = new Wall({
            p: new Vec2(safeX, this.height),
            width: wWidth,
            type: newType
          });
          
          if (newType === "normal" || newType === "jump") {
            const roll = Math.random();
            // --- MODIFIED FREQUENCY HERE ---
            // Increased correct answer probability from 0.4 to 0.7
            if (roll < 0.7) {
                newWall.label = this.correctAnswer;
            } else if (roll < 0.95) { // Wrong answer probability adjusted
                newWall.label = this.wrongAnswer;
            }
          }
          
          this.walls.push(newWall);
        }
        
        let touching = false
        this.walls.forEach(wall=>{  
          wall.update() 
          if (wall.p.x-wall.width/2<this.player.p.x+this.player.width/2
              &&   wall.p.x+wall.width/2>this.player.p.x-this.player.width/2){
            if (this.player.p.y>wall.p.y 
                && this.player.p.y<wall.p.y+wall.height+10){ 
              touching=true
              wall.step(this.player)
              this.player.lastBlock=wall
            }
          }
        }) 
        
        if (!touching){
          this.player.lastBlock=null
          // Audio pause removed
        }

        this.walls = this.walls.filter(wall=>wall.active)
        
        if (this.player.p.y-this.player.height<0){
          if (this.hurt==0){   
            this.hurt=1
            this.player.bloodDelta(-2)
            this.player.v.y=2
            this.player.p.y=10
            TweenMax.to(this,0.5,{hurt: 0})
          }
        }
        
        if (this.player.p.x-this.player.width/2<0){
          this.player.p.x=this.player.width/2
        }
        if (this.player.p.x+this.player.width/2>this.width){
          this.player.p.x=this.width-this.player.width/2
        }
        
        if (this.player.p.y>wh+this.player.height){
          game.end()
        }
      }
      
      draw(){
        ctx.save()
          ctx.translate(ww/2-this.width/2,0)
          let span = this.width/60
          ctx.beginPath()
          for(var i=0;i<=this.width/span;i++){
            ctx.lineTo(i*span,(i%2)*30)
          }  
          ctx.fillStyle="white"
          ctx.fill()
        
          ctx.beginPath()
          ctx.moveTo(0,0)
          ctx.lineTo(0,wh)
          ctx.moveTo(this.width,0)
          ctx.lineTo(this.width,wh)
          ctx.strokeStyle="rgba(255,255,255,0.3)"
          ctx.stroke()
        
          this.player.draw()
          this.walls.forEach(wall=>wall.draw())
        ctx.restore()
        
        ctx.fillStyle="rgba(255,0,0,"+this.hurt+")"
        ctx.fillRect(0,0,ww,wh)
        
        this.player.drawBlood()
        
        ctx.textAlign = "center"; 
        ctx.fillStyle='white';
        
        let fontSize = Math.min(ww / 14, 30); 
        let uiCenterX = ww / 2;
        
        ctx.font = fontSize + "px Arial";
        ctx.fillText("Basement：" + (parseInt(this.time/100)) + "/F", uiCenterX, 80);
        
        ctx.fillStyle='#ffdd38';
        // Draw the question using the formal renderer
        drawFormalExpression(ctx, "Simplify: " + this.mathQuestion, uiCenterX, 130, fontSize * 1.2, '#ffdd38', 'center');
        
        ctx.textAlign = "start"; 
      }
    }

    //玩家物件
    class Player{
      constructor(args){
        let def = {
          p: new Vec2(0,0),
          v: new Vec2(0,0),
          a: new Vec2(0,1), 
          width: 40,
          height: 55,
          blood: 10,
          maxBlood: 10,
          lastBlock: null,
        }
        Object.assign(def,args)
        Object.assign(this,def)
      }
      update(){
        this.p=this.p.add(this.v)
        this.v=this.v.add(this.a)
        
      }
      draw(){
        ctx.beginPath()
        ctx.save()
          ctx.translate(this.p.x,this.p.y)
          ctx.fillStyle="#0047ba"
          ctx.fillRect(-this.width/2,-this.height,this.width,this.height)
          ctx.fillStyle="#ffdd38"

          ctx.fillRect(-5,-30,10,10)

          ctx.beginPath()
          ctx.arc(-6,-40,5,0,Math.PI*2)
          ctx.arc(+6,-40,5,0,Math.PI*2)
          ctx.fillStyle="white"
          ctx.fill()

          ctx.beginPath()
          ctx.arc(-6,-40,3,0,Math.PI*2)
          ctx.arc(+6,-40,3,0,Math.PI*2)
          ctx.fillStyle="black"   
          ctx.fill()
        
        ctx.save()
            ctx.translate(+this.width/2,-40)
            ctx.rotate(-Math.log(this.v.y/2))
            ctx.fillStyle="#416ee0"
            ctx.fillRect(0,0,8,this.height/2 )

          ctx.restore()

          ctx.save()
            ctx.translate(-this.width/2,-40)
            ctx.rotate(Math.log(this.v.y/2))
            ctx.fillStyle="#416ee0"
            ctx.fillRect(-8,0,8,this.height/2 )

          ctx.restore()

        ctx.restore()
      }
      drawBlood(){
        let barWidth = 10;
        let gap = 4;
        let totalWidth = 10 * barWidth + 9 * gap;
        let startX = (ww - totalWidth) / 2;
        
        for(var i=0;i<10;i++){
          ctx.fillStyle=i<this.blood?"red":"rgba(255,255,255,0.2)"
          ctx.fillRect(startX + i*(barWidth+gap), 40, barWidth, 20)
        }
      }
      bloodDelta(delta){
        if (delta<0){
          playSound('hurt')
        }
        this.blood+=delta
        if (this.blood>this.maxBlood){
          this.blood=this.maxBlood
        }
        if (this.blood<=0){
          this.blood=0
          game.end()
        }
      }
    }

    //-----------------
    //      牆壁物件
    //-----------------
    class Wall{
      constructor(args){
        let def = {
          p: new Vec2(0,0),
          v: new Vec2(0,-3),
          a: new Vec2(0,0),
          width: 150,
          height: 20, 
          extraHeight: 0,
          type: "normal",
          active: true,
          label: null 
        }
        Object.assign(def,args)
        Object.assign(this,def)
      }
      update(){
        this.p=this.p.add(this.v)
        this.v=this.v.add(this.a)
        if (this.p.y<-20){
          this.active=false
        }
      }
      
      draw(){
        ctx.save()
        ctx.translate(this.p.x-this.width/2,this.p.y-this.extraHeight)
          ctx.fillStyle="white"
          
          if (this.type=="normal" || this.type=="hurt"){
            ctx.fillStyle="#888" 
            ctx.fillRect(0,0,this.width,this.height/2)
          }
        
          if (this.type=="hurt"){
            ctx.beginPath()
            let span = this.width/16
            for(var i=0;i<=this.width/span;i+=1){ 
              ctx.lineTo(0+i*span,-(i%2)*15)
            }
            ctx.fillStyle="#ddd" 
            ctx.fill()
          }
        
          if (this.type=="jump"){
            ctx.fillStyle="#53d337"
            ctx.fillRect(0,0,this.width,5)
            ctx.fillRect(0,this.height+this.extraHeight,this.width,5)
          }
          if (this.type=="fade"){
            ctx.fillStyle="#ffd428"
            ctx.fillRect(0,0,this.width,this.height)
          }
          if (this.type=="slideLeft" || this.type=="slideRight"){
            for(var i=-1;i<this.width/20;i+=1){ 
              let x = 0+i*20+(time%20)* (this.type=="slideLeft"?-1:1)
              let width = 10
              if (x<0){
                x=0
              } 
              if (x+width>this.width){
                width = this.width-x<0?0:(this.width-x)
              }
              ctx.fillStyle="red"
              ctx.save()
              ctx.transform(1, 0,0.5, 1, 0, 0)
              ctx.fillRect(x ,0,width,this.height)
              ctx.restore()
            }
          }
          
          if (this.label !== null) {
              ctx.shadowColor="black";
              ctx.shadowBlur=4;
              // Use the helper function to draw formal fractions or powers
              drawFormalExpression(ctx, this.label, this.width/2, -8, 24, "white", "center");
              ctx.shadowBlur=0;
          }
          
        ctx.restore()
      } 
      step(player){
        player.v.y=0
        if (player.lastBlock!=this){
          
          if (this.label !== null) {
              if (this.label === game.correctAnswer) {
                  playSound('correct'); 
                  player.bloodDelta(1);
                  game.generateMathProblem();
              } else {
                  // WRONG ANSWER LOGIC
                  player.bloodDelta(-1);
                  
                  // *** FLASH RED ***
                  game.hurt = 1; 
                  TweenMax.to(game, 0.2, { hurt: 0 });
              }
              this.label = null; // Remove label after hitting
          }

          if (this.type=="normal"){
            playSound('step')
          }
          if (this.type=="fade"){
            playSound('fade')
          }
          if (this.type=="hurt"){
            playSound('hurt')
          }
          if (this.type=="jump"){
            playSound('jump')
          }
        }
        if (this.type=="normal"){
          player.p.y = this.p.y
        }
        if (this.type=="hurt"){
          player.p.y = this.p.y
          
          if (player.lastBlock!=this){
            player.bloodDelta(-2) 
            game.hurt=1
            TweenMax.to( game,0.2,{hurt: 0} )
          }
        }
        if (this.type=="jump"){
          player.v.y = -15
          this.extraHeight=10
          TweenMax.to(this,0.2,{extraHeight: 0})
        } 
        if (this.type=="slideLeft"){ 
          player.p.x-=3
          player.p.y = this.p.y
             // Audio removed
        }
        if (this.type=="slideRight"){
          player.p.x+=3
          player.p.y = this.p.y
             // Audio removed
        }
        if (this.type=="fade"){
          player.p.y-=2
        }
      }
      
    }

    function initCanvas(){
      ww = canvas.width = window.innerWidth
      wh = canvas.height = window.innerHeight
      if(game) {
        game.width = Math.min(ww, 700);
        game.height = wh;
      }
    }
    
    var game = new Game
    initCanvas()

    function init(){
      game.init()
    }
    function update(){
      time++
      if (game.playing){
        game.update()
      }
    }
    function draw(){
      ctx.fillStyle=bgColor
      ctx.fillRect(0,0,ww,wh)
      game.draw()
      requestAnimationFrame(draw)
    }
    function loaded(){
      initCanvas()
      init()
      requestAnimationFrame(draw)
      setInterval(update,1000/updateFPS)
    }
    window.addEventListener("load",loaded)
    window.addEventListener("resize",initCanvas)

    //滑鼠事件跟紀錄
    var mousePos = new Vec2(0,0)
    var mousePosDown = new Vec2(0,0)
    var mousePosUp = new Vec2(0,0)

    window.addEventListener("mousemove",mousemove)
    window.addEventListener("mouseup",mouseup)
    window.addEventListener("mousedown",mousedown)
    function mousemove(evt){
      mousePos.set(evt.clientX,evt.clientY)
    }
    function mouseup(evt){
      mousePos.set(evt.clientX,evt.clientY)
      mousePosUp = mousePos.clone()
      
    }
    function mousedown(evt){
      mousePos.set(evt.clientX,evt.clientY)
      mousePosDown = mousePos.clone()
    }

    window.addEventListener('keydown',function(evt){
      let key = evt.key.replace("Arrow","").toLowerCase()
      game.keystatus[key]=true
    })

    window.addEventListener('keyup',function(evt){
      let key = evt.key.replace("Arrow","").toLowerCase()
      game.keystatus[key]=false
    })

    // Touch controls
    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');
    
    const handleTouchStart = (direction) => (e) => {
        e.preventDefault(); 
        game.keystatus[direction] = true;
        e.target.style.backgroundColor = "rgba(255, 255, 255, 0.4)";
    };

    const handleTouchEnd = (direction) => (e) => {
        e.preventDefault();
        game.keystatus[direction] = false;
        e.target.style.backgroundColor = "rgba(255, 255, 255, 0.1)";
    };
    
    leftBtn.addEventListener('touchstart', handleTouchStart('left'), {passive: false});
    leftBtn.addEventListener('touchend', handleTouchEnd('left'), {passive: false});
    
    rightBtn.addEventListener('touchstart', handleTouchStart('right'), {passive: false});
    rightBtn.addEventListener('touchend', handleTouchEnd('right'), {passive: false});

    document.getElementById('submitName').addEventListener('click', submitName);
    document.getElementById('nameInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        submitName();
      }
    });
  </script>
</body>
